# Render Blueprint (render.yaml) — deploy on Render with "New + → Blueprint".
# Paste this file, connect your repo, and Render provisions the service.
#
# Free tier note: without traffic Render spins the web service down after ~15
# minutes. The app is configured with KEEP_ALIVE=1 (see .env.example) so it
# self-pings /health on a 30s loop and stays "busy" - it never goes idle.
# Optionally pair it with Render's free cron job / an external uptime checker.

services:
  - type: web
    name: distract-yt
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: uv sync --no-dev
    startCommand: uv run gunicorn "distract_yt:create_app()" --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14"
      - key: HOST
        value: "0.0.0.0"
      - key: DEBUG
        value: "0"
      - key: KEEP_ALIVE
        value: "1"
      - key: KEEP_ALIVE_INTERVAL
        value: "30"
      - key: DATABASE_URL
        sync: false   # set a Render Postgres connection string → Schema Editor
      - key: YOUTUBE_API_KEY
        sync: false   # set your Google API key in the Render dashboard
      - key: SECRET_KEY
        sync: false