[project]
name = "distract-yt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sarthak-shree", email = "shree1322a@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
distract-yt = "distract_yt:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
